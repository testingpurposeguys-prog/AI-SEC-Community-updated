<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — AI-SEC Community</title>
  <meta name="description" content="Create your AI-SEC Community account to register for meetups, workshops, and hackathons." />

  <link rel="canonical" href="https://aisec.community/register" />

  <!-- Open Graph / social cards -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Register — AI-SEC Community" />
  <meta property="og:description" content="Join the AI-SEC Community." />
  <meta property="og:image" content="assets/images/logo.png" />
  <meta property="og:url" content="https://aisec.community/register" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Register — AI-SEC Community" />
  <meta name="twitter:description" content="Join the AI-SEC Community." />
  <meta name="twitter:image" content="assets/images/logo.png" />

  <link rel="icon" type="image/svg+xml" href="/Images/logo.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="js/site-chrome.js"></script>
</head>
<body>

  <site-header></site-header>

  <main>
    <section class="section" aria-labelledby="register-title">
      <div class="container">
        <div class="section__header" data-animate="fade-up">
          <h1 class="section__title" id="register-title">Create your AI-SEC Community account</h1>
          <p class="section__subtitle">Join the practitioner-led network for AI security and AI for security.</p>
        </div>

        <article class="card" data-animate="fade-up" style="max-width: 640px; margin-inline: auto;">
          <div class="card__body">
            <form class="auth-form" action="#" method="post" autocomplete="on">
              <div class="form-group">
                <label class="form-label" for="register-name">Full name</label>
                <input class="form-input" type="text" id="register-name" name="name" placeholder="Your name" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="register-email">Email address</label>
                <input class="form-input" type="email" id="register-email" name="email" placeholder="you@example.com" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="register-password">Password</label>
                <input class="form-input" type="password" id="register-password" name="password" placeholder="Choose a strong password" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="register-password-confirm">Confirm password</label>
                <input class="form-input" type="password" id="register-password-confirm" name="password_confirm" placeholder="Repeat your password" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="register-role">Your role in the community</label>
                <select class="form-input" id="register-role" name="role" required>
                  <option value="" disabled selected>Select one</option>
                  <option value="practitioner">Security practitioner / engineer</option>
                  <option value="researcher">Researcher / academic</option>
                  <option value="student">Student / early-career</option>
                  <option value="organizer">Organizer / volunteer</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="register-city">City</label>
                <input class="form-input" type="text" id="register-city" name="city" placeholder="e.g. Bangalore" />
              </div>

              <div class="form-group">
                <label class="form-label" for="register-linkedin">LinkedIn profile (optional)</label>
                <input class="form-input" type="url" id="register-linkedin" name="linkedin" placeholder="https://www.linkedin.com/in/username" />
              </div>

              <div class="form-group">
                <label class="form-label" style="display:flex; align-items:flex-start; gap:0.5rem;">
                  <input type="checkbox" name="subscribe" />
                  <span>Subscribe me to meetup and workshop updates.</span>
                </label>
              </div>

              <div class="form-group">
                <label class="form-label" style="display:flex; align-items:flex-start; gap:0.5rem;">
                  <input type="checkbox" name="coc" required />
                  <span>I agree to follow the <a href="get-involved.html#code-of-conduct">AI-SEC Community Code of Conduct</a>.</span>
                </label>
              </div>

              <button class="btn btn-primary form-submit" type="submit">Create Account</button>

              <p class="card__text" style="margin-top: 1rem;">
                Already have an account?
                <a href="login.html">Sign in</a>.
              </p>
            </form>
          </div>
        </article>
      </div>
    </section>
  </main>

  <site-footer></site-footer>

  <script src="js/main.js" defer></script>
  <script src="js/animations.js" defer></script>
  <script src="js/stats-counter.js" defer></script>
  <script src="js/event-filters.js" defer></script>
  <script src="js/forms.js" defer></script>
  <script src="js/auth-guard.js" defer></script>
</body>
</html>
