<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Sign in — AI-SEC Community Admin</title>
<link rel="icon" href="logo.png">
<style>
:root{--bg:#0f0f1a;--card:#1a1a2e;--ink:#f3f0fa;--mut:#a9a3c0;--pri:#9930F6;--pri2:#6B1FCC}
@media(prefers-color-scheme:light){:root{--bg:#FBF8FE;--card:#fff;--ink:#1A1A2E;--mut:#55506B}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;padding:1rem}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid #9930f633;border-radius:16px;padding:2.2rem 2rem;text-align:center;box-shadow:0 10px 40px #9930f622}
img{width:56px;height:56px}h1{font:800 1.4rem Poppins,system-ui,sans-serif;margin:.8rem 0 .3rem}p{color:var(--mut);margin:.2rem 0 1.4rem;font-size:.95rem}
button{width:100%;padding:.8rem 1rem;border:0;border-radius:10px;background:var(--pri);color:#fff;font:600 1rem inherit;cursor:pointer;display:flex;gap:.6rem;justify-content:center;align-items:center}
button:hover{background:var(--pri2)}button:disabled{opacity:.6;cursor:wait}
#err{color:#ff6b6b;font-size:.9rem;margin:1rem 0 0;min-height:1.2em}small{display:block;margin-top:1.2rem;color:var(--mut)}
</style></head><body>
<main class="card">
  <img src="logo.png" alt="AI-SEC Community logo">
  <h1>AI-SEC Admin</h1>
  <p>Organizers only. Sign in with your GitHub account to manage meetups, monthly updates and partners.</p>
  <button id="go" type="button"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.93-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.23 1.88.88 2.34.67.07-.52.28-.88.51-1.08-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.83-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.52.56.83 1.28.83 2.15 0 3.07-1.87 3.75-3.66 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>Sign in with GitHub</button>
  <div id="err" role="alert"></div>
  <small><a href="guide.html" style="color:inherit">How to use this dashboard</a><br><br>Access needs write permission on the community's GitHub repo.</small>
</main>
<script src="login.js"></script></body></html>
